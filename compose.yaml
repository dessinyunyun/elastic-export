services:
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.0.0}
    pull_policy: missing
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 2g

  kibana:
    image: ${KIBANA_IMAGE:-docker.elastic.co/kibana/kibana:9.0.0}
    pull_policy: missing
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s
    mem_limit: 2g

volumes:
  elasticsearch-data:
